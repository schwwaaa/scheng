[package]
name    = "scheng-processor"
version = "0.1.0"
edition = "2021"
description = "Webcam input → proc-amp shader → Syphon output. Live video effect unit."

[dependencies]
scheng-runtime-wgpu  = { path = "../scheng/crates/scheng-runtime-wgpu" }
scheng-graph         = { path = "../scheng/crates/scheng-graph" }
scheng-hotreload     = { path = "../scheng/crates/scheng-hotreload" }
scheng-param-store   = { path = "../scheng/crates/scheng-param-store" }
scheng-input-webcam  = { path = "../scheng/crates/scheng-input-webcam", features = ["native"] }

log        = "0.4"
env_logger = "0.11"
winit      = "0.30"
wgpu       = "23"
midir      = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
scheng-output-syphon = { path = "../scheng/crates/scheng-output-syphon" }
foreign-types-shared = "0.3"
