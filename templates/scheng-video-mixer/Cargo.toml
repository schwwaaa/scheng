[package]
name    = "scheng-video-mixer"
version = "0.1.0"
edition = "2021"
description = "Two video files → MIDI T-bar crossfade → preview + Syphon output"

[dependencies]
scheng-runtime-wgpu = { path = "../scheng/crates/scheng-runtime-wgpu" }
scheng-graph        = { path = "../scheng/crates/scheng-graph" }
scheng-hotreload    = { path = "../scheng/crates/scheng-hotreload" }
scheng-param-store  = { path = "../scheng/crates/scheng-param-store" }
scheng-input-video  = { path = "../scheng/crates/scheng-input-video", features = ["decode"] }

log        = "0.4"
env_logger = "0.11"
winit      = "0.30"
wgpu       = "23"
midir      = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
scheng-output-syphon = { path = "../scheng/crates/scheng-output-syphon" }
