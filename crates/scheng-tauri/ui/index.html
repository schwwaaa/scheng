<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>scheng</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d0d0d;
      --surface:  #1a1a1a;
      --border:   #2a2a2a;
      --accent:   #00e5ff;
      --text:     #e0e0e0;
      --text-dim: #666;
      --danger:   #ff4444;
      --success:  #44ff88;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 12px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .logo { color: var(--accent); font-weight: 700; font-size: 14px; letter-spacing: 0.1em; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim); }
    .status-dot.ready { background: var(--success); }
    .status-dot.recording { background: var(--danger); animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .status-text { color: var(--text-dim); }
    .frame-counter { margin-left: auto; color: var(--text-dim); font-size: 10px; }

    /* ── Main layout ── */
    main {
      display: grid;
      grid-template-columns: 260px 1fr;
      overflow: hidden;
    }

    /* ── Param panel (left) ── */
    #param-panel {
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .param-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 4px;
      align-items: center;
    }

    .param-name { color: var(--text-dim); font-size: 10px; }

    .param-slider {
      width: 100%;
      -webkit-appearance: none;
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      outline: none;
    }

    .param-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }

    .param-value {
      color: var(--accent);
      font-size: 10px;
      width: 40px;
      text-align: right;
    }

    /* ── Preview canvas (right) ── */
    #preview-area {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      position: relative;
    }

    #preview {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      image-rendering: pixelated;
    }

    .preview-placeholder {
      color: var(--text-dim);
      text-align: center;
    }

    /* ── Footer / transport ── */
    footer {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 16px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    .output-buttons { display: flex; gap: 4px; }

    .btn {
      background: var(--border);
      border: 1px solid #333;
      color: var(--text);
      padding: 4px 10px;
      border-radius: 3px;
      cursor: pointer;
      font-family: inherit;
      font-size: 11px;
      transition: background 0.1s;
    }

    .btn:hover  { background: #333; }
    .btn.active { background: var(--accent); color: #000; border-color: var(--accent); }
    .btn.danger { background: var(--danger); color: #fff; border-color: var(--danger); }

    .spacer { flex: 1; }

    #adapter-info { color: var(--text-dim); font-size: 10px; }
  </style>
</head>
<body>

<header>
  <span class="logo">scheng</span>
  <div class="status-dot" id="status-dot"></div>
  <span class="status-text" id="status-text">initialising…</span>
  <span class="frame-counter" id="frame-counter">frame 0</span>
</header>

<main>
  <section id="param-panel">
    <div style="color: var(--text-dim); font-size: 10px; padding-bottom: 4px;">PARAMETERS</div>
    <!-- populated by buildParamUI() -->
  </section>

  <section id="preview-area">
    <div class="preview-placeholder" id="preview-placeholder">
      <div style="font-size: 24px; margin-bottom: 8px;">◈</div>
      <div>waiting for GPU…</div>
    </div>
    <img id="preview" style="display:none" alt="preview" />
  </section>
</main>

<footer>
  <div class="output-buttons">
    <button class="btn active" id="btn-preview"  onclick="setMode('preview')">Preview</button>
    <button class="btn"        id="btn-syphon"   onclick="setMode('syphon')">Syphon</button>
    <button class="btn"        id="btn-stream"   onclick="setMode('stream')">Stream</button>
    <button class="btn"        id="btn-ndi"      onclick="setMode('ndi')">NDI</button>
  </div>

  <div class="spacer"></div>

  <button class="btn" id="btn-record" onclick="toggleRecording()">⏺ Record</button>
  <span id="adapter-info">—</span>
</footer>

<script>
// ── Tauri IPC ─────────────────────────────────────────────────────────────
const { invoke, listen, emit } = window.__TAURI_INTERNALS__
  ? { invoke: window.__TAURI__.core.invoke,
      listen:  window.__TAURI__.event.listen,
      emit:    window.__TAURI__.event.emit }
  : { invoke: async () => {}, listen: async () => {}, emit: async () => {} };

// ── State ─────────────────────────────────────────────────────────────────
let currentMode    = 'preview';
let isRecording    = false;
let paramValues    = {};
let statusInterval = null;

// ── Init ──────────────────────────────────────────────────────────────────
async function init() {
  // Build param UI from schema
  await buildParamUI();

  // Listen for preview frames
  await listen('preview-frame', (event) => {
    const img = document.getElementById('preview');
    const placeholder = document.getElementById('preview-placeholder');
    img.src = 'data:image/jpeg;base64,' + event.payload;
    img.style.display = 'block';
    placeholder.style.display = 'none';
  });

  // Listen for params reload
  await listen('params-reloaded', async () => {
    console.log('params.json reloaded — rebuilding UI');
    await buildParamUI();
  });

  // Poll engine status at 1Hz
  statusInterval = setInterval(pollStatus, 1000);
  await pollStatus();
}

// ── Param UI ──────────────────────────────────────────────────────────────
async function buildParamUI() {
  const schema = await invoke('get_params').catch(() => ({ params: [] }));
  const panel  = document.getElementById('param-panel');

  // Clear existing param rows (keep the header)
  const header = panel.firstElementChild;
  panel.innerHTML = '';
  panel.appendChild(header);

  for (const p of (schema.params || [])) {
    const row = document.createElement('div');
    row.className = 'param-row';
    row.innerHTML = `
      <div>
        <div class="param-name">${p.name}${p.midi_cc != null ? ` [CC${p.midi_cc}]` : ''}</div>
        <input
          type="range" class="param-slider"
          min="${p.min ?? 0}" max="${p.max ?? 1}" step="0.001"
          value="${p.default ?? 0}"
          data-name="${p.name}"
          oninput="onSlider(this)"
        />
      </div>
      <span class="param-value" id="val-${p.name}">${(p.default ?? 0).toFixed(3)}</span>
    `;
    panel.appendChild(row);
    paramValues[p.name] = p.default ?? 0;
  }
}

async function onSlider(el) {
  const name  = el.dataset.name;
  const value = parseFloat(el.value);
  paramValues[name] = value;
  document.getElementById('val-' + name).textContent = value.toFixed(3);
  await invoke('set_param', { args: { name, value } }).catch(console.error);
}

// ── Output mode ───────────────────────────────────────────────────────────
async function setMode(mode) {
  currentMode = mode;
  ['preview','syphon','spout','stream','ndi'].forEach(m => {
    const btn = document.getElementById('btn-' + m);
    if (btn) btn.classList.toggle('active', m === mode);
  });
  await invoke('set_output_mode', { args: { mode } }).catch(console.error);
}

// ── Recording ─────────────────────────────────────────────────────────────
async function toggleRecording() {
  const btn = document.getElementById('btn-record');
  if (!isRecording) {
    await invoke('start_recording', { args: {} }).catch(console.error);
    isRecording = true;
    btn.textContent = '⏹ Stop';
    btn.classList.add('danger');
    document.getElementById('status-dot').className = 'status-dot recording';
  } else {
    await invoke('stop_recording').catch(console.error);
    isRecording = false;
    btn.textContent = '⏺ Record';
    btn.classList.remove('danger');
    document.getElementById('status-dot').className = 'status-dot ready';
  }
}

// ── Status poll ───────────────────────────────────────────────────────────
async function pollStatus() {
  const s = await invoke('get_engine_status').catch(() => null);
  if (!s) return;

  const dot  = document.getElementById('status-dot');
  const text = document.getElementById('status-text');
  const ctr  = document.getElementById('frame-counter');
  const adap = document.getElementById('adapter-info');

  if (s.running) {
    dot.className  = isRecording ? 'status-dot recording' : 'status-dot ready';
    text.textContent = isRecording ? 'recording' : 'running';
  } else {
    dot.className  = 'status-dot';
    text.textContent = 'initialising…';
  }

  ctr.textContent  = `frame ${s.frame.toLocaleString()}`;
  adap.textContent = s.adapter_name;
}

// ── Boot ──────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
