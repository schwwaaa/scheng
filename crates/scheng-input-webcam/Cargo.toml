[package]
name        = "scheng-input-webcam"
version     = "0.1.0"
edition     = "2021"
description = "Webcam capture → wgpu texture for scheng instruments"
license     = "MIT"

[dependencies]
scheng-runtime-wgpu = { path = "../scheng-runtime-wgpu" }
wgpu      = "22"
log       = "0.4"
thiserror = "1"

# nokhwa: cross-platform webcam capture
# macOS: AVFoundation, Windows: DirectShow/Media Foundation, Linux: V4L2
nokhwa = { version = "0.10", features = ["input-native", "output-threaded"], optional = true }

[features]
default = []
# Enable to build with real camera capture. Without this, returns NotEnabled at runtime.
native = ["dep:nokhwa"]
