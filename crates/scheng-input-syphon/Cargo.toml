[package]
name        = "scheng-input-syphon"
version     = "0.1.0"
edition     = "2021"
description = "Syphon Metal receive → wgpu texture for scheng instruments (macOS only)"
license     = "MIT"

[dependencies]
wgpu      = "22"
log       = "0.4"
thiserror = "1"

[build-dependencies]
cc = "1"

[target.'cfg(target_os = "macos")'.dependencies]
# No extra Rust deps — Metal interop is pure ObjC via the C bridge

[features]
default = []
# Enable to compile the ObjC Metal bridge and link Syphon.framework.
# Requires vendor/Syphon.framework to be present.
# Download: https://github.com/Syphon/Syphon-Framework/releases
syphon-framework = []
