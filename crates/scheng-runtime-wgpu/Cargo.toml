[package]
name        = "scheng-runtime-wgpu"
version     = "0.1.0"
edition     = "2021"
description = "wgpu (Metal/DX12/Vulkan) backend for scheng"
license     = "MIT"

[dependencies]
scheng-core    = { path = "../scheng-core" }
scheng-graph   = { path = "../scheng-graph" }
scheng-runtime = { path = "../scheng-runtime" }

wgpu      = { version = "22", features = ["naga-ir"] }
naga      = { version = "22", features = ["glsl-in"] }
bytemuck  = { version = "1",  features = ["derive"] }
pollster  = "0.3"
once_cell = "1"
log       = "0.4"
thiserror = "1"
regex     = "1"

[dev-dependencies]
env_logger = "0.11"
