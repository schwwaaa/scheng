[package]
name        = "scheng-input-video"
version     = "0.1.0"
edition     = "2021"
description = "Video file decoder → wgpu texture for scheng VideoDecodeSource nodes"
license     = "MIT"

[dependencies]
scheng-graph = { path = "../scheng-graph" }
wgpu         = "23"
log          = "0.4"
thiserror    = "1"

# ffmpeg-next tracks ffmpeg major versions.
# macOS:   brew install ffmpeg
# Linux:   apt install libavcodec-dev libavformat-dev libswscale-dev
# Windows: vcpkg install ffmpeg
ffmpeg-next = { version = "8", optional = true }

[features]
default = []
decode  = ["dep:ffmpeg-next"]
