[package]
name        = "scheng-output-ndi"
version     = "0.1.0"
edition     = "2021"
description = "NDI output sink for scheng (cross-platform, requires NDI 6 SDK)"
license     = "MIT"

[dependencies]
scheng-runtime-wgpu = { path = "../scheng-runtime-wgpu" }
scheng-graph         = { path = "../scheng-graph" }
log        = "0.4"
wgpu       = "23"
thiserror  = "1"

# grafton-ndi: NDI 6 SDK bindings (macOS/Windows/Linux)
# Requires NDI SDK installed: https://ndi.video/download-ndi-sdk/
# macOS default: /Library/NDI SDK for Apple
# Set NDI_SDK_DIR env var if installed elsewhere.
grafton-ndi = { version = "0.11", optional = true }

[features]
default = []
ndi     = ["dep:grafton-ndi"]
